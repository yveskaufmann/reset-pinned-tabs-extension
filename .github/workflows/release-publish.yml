name: Release Publish
run-name: Release Publish

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to publish (e.g. v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  publish-release:
    if: github.event_name == 'workflow_dispatch' || github.event.release.draft == true
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 #v6.2.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Resolve release tag
        id: release-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download draft assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "*.zip" --pattern "release-meta.json" --dir dist --clobber

      - name: Restore extension source from unsigned archive
        run: |
          unsigned_zip="$(find dist -maxdepth 1 -name '*.zip' | head -n 1)"
          if [[ -z "$unsigned_zip" ]]; then
            echo "Error: no unsigned extension archive found in dist." >&2
            exit 1
          fi

          rm -rf dist/build
          mkdir -p dist/build
          unzip -q "$unsigned_zip" -d dist/build

      - name: Sign extension on AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: ./scripts/release/publish-ext.sh --source-dir dist/build --artifacts-dir dist --metadata-file dist/release-meta.json --channel listed

      - name: Upload signed extension
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.xpi --clobber

      - name: Remove release metadata asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: gh release delete-asset "$RELEASE_TAG" "release-meta.json" --yes

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
